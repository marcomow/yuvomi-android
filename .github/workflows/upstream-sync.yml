# The mechanical sync to a new upstream Yuvomi release, by hand: re-runs
# upstream/sync.sh against it and opens (or updates) a pull request with the
# regenerated snapshots and a report of what changed for this app.
# No schedule: the weekly port (a scheduled Claude Code session) syncs and ports
# in one PR. See docs/UPSTREAM-SYNC.md.
name: Upstream sync

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to sync to (e.g. 2.84.0). Empty = latest release.'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pick the upstream version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          pinned="$(tr -d '[:space:]' < upstream/VERSION)"
          if [ -n "$REQUESTED" ]; then
            target="${REQUESTED#v}"
          else
            target="$(gh api repos/ulsklyc/yuvomi/releases/latest --jq .tag_name)"
            target="${target#v}"
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$target" ] && [ -z "$REQUESTED" ]; then
            echo "Already on $pinned, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync
        if: steps.pick.outputs.skip != 'true'
        env:
          SYNC_REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          ./upstream/sync.sh "${{ steps.pick.outputs.target }}"
          if head -1 "$SYNC_REPORT" | grep -q 'breaking'; then
            echo "LABELS=upstream-sync,breaking" >> "$GITHUB_ENV"
          else
            echo "LABELS=upstream-sync" >> "$GITHUB_ENV"
          fi

      - name: Open or update the pull request
        if: steps.pick.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream-sync/${{ steps.pick.outputs.target }}
          title: 'Upstream sync: ${{ steps.pick.outputs.pinned }} → ${{ steps.pick.outputs.target }}'
          commit-message: 'chore(upstream): sync to Yuvomi ${{ steps.pick.outputs.target }}'
          body-path: ${{ runner.temp }}/sync-report.md
          labels: ${{ env.LABELS }}
          draft: true
          delete-branch: true
