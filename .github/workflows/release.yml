# Continuous delivery of the APK to GitHub Releases (docs/RELEASING.md, ADR 0013, ADR 0014).
#
# - Every push to main that changes the app publishes the next patch version
#   (v0.1.0, v0.1.1, ...). Tests are not repeated here: the pull request's checks
#   already ran them on the same code (ADR 0014).
# - Actions -> Release -> Run workflow on main publishes now; give a version to
#   jump (e.g. 0.2.0 or 1.0.0) or leave it empty for the next patch.
# - Pushing a tag v<major>.<minor>.<patch> publishes that version.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'upstream/VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0 (empty: next patch)'
        required: false
        type: string

permissions:
  contents: write

# One release at a time, in order; a newer push waits rather than racing for a tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.YUVOMI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Pick the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tags="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##')"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"; create=false
          else
            # main, not the repository's default branch, which can be set to something else.
            if [[ "$GITHUB_REF_NAME" != 'main' ]]; then
              echo "::error::Release from main, not $GITHUB_REF_NAME"; exit 1
            fi
            version="${INPUT_VERSION//[[:space:]]/}"
            # This commit is already released and no version was asked for (a re-run): nothing to do.
            if [[ -z "$version" ]] && git ls-remote --tags --refs origin 'v*' | grep -q "^$GITHUB_SHA"; then
              echo "Commit $GITHUB_SHA is already released."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [[ -n "$version" ]]; then
              tag="v${version#v}"
            else
              last="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | sort -V | tail -1)"
              if [[ -z "$last" ]]; then
                tag="v0.1.0"
              else
                IFS=. read -r ma mi pa <<<"${last#v}"
                tag="v${ma}.${mi}.$((pa + 1))"
              fi
            fi
            if grep -qx "$tag" <<<"$tags"; then
              echo "::error::Tag $tag already exists; pick a higher version"; exit 1
            fi
            create=true
          fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::'$tag' is not v<major>.<minor>.<patch>"; exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          # versionCode = major*1000000 + minor*1000 + patch (ADR 0014).
          if (( major > 2000 || minor > 999 || patch > 999 )); then
            echo "::error::major <= 2000, minor and patch <= 999 (versionCode scheme)"; exit 1
          fi
          last="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$tags" | grep -vx "$tag" | sort -V | tail -1)"
          if [[ -n "$last" && "$(printf '%s\n%s\n' "$last" "$tag" | sort -V | tail -1)" != "$tag" ]]; then
            echo "::error::$tag is not higher than the latest release $last; Android would refuse the update"; exit 1
          fi
          {
            echo "skip=false"
            echo "tag=$tag"
            echo "create=$create"
            echo "name=${major}.${minor}.${patch}"
            echo "code=$(( 10#$major * 1000000 + 10#$minor * 1000 + 10#$patch ))"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Release key
        if: steps.version.outputs.skip != 'true' && env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.YUVOMI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "YUVOMI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APK
        if: steps.version.outputs.skip != 'true'
        env:
          YUVOMI_KEYSTORE_PASSWORD: ${{ secrets.YUVOMI_KEYSTORE_PASSWORD }}
          YUVOMI_KEY_ALIAS: ${{ secrets.YUVOMI_KEY_ALIAS }}
          YUVOMI_KEY_PASSWORD: ${{ secrets.YUVOMI_KEY_PASSWORD }}
        run: |
          if [[ "$HAS_KEY" != 'true' ]]; then
            echo "::warning::No release key in the repository secrets; signing with a throwaway debug key (docs/RELEASING.md)."
            fallback="-Pyuvomi.debugSignRelease=true"
          fi
          ./gradlew --no-daemon assembleRelease \
            -Pyuvomi.versionName='${{ steps.version.outputs.name }}' \
            -Pyuvomi.versionCode='${{ steps.version.outputs.code }}' \
            ${fallback:-}

      - name: Verify signature and prepare assets
        if: steps.version.outputs.skip != 'true'
        id: assets
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk="yuvomi-android-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          sha256sum "$apk" > "$apk.sha256"
          cert="$(grep -m1 'certificate SHA-256 digest' certs.txt | sed 's/.*: //')"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          {
            echo "Unofficial proof-of-concept Android client for [Yuvomi](https://github.com/ulsklyc/yuvomi). Not affiliated with upstream."
            echo
            echo "- Version ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }}), built against Yuvomi $(tr -d '[:space:]' < upstream/VERSION) from ${GITHUB_SHA::7}"
            echo "- Android 8.0 or newer. Install by opening the APK on the phone and allowing installs from that app."
            echo "- Signing certificate SHA-256: \`${cert}\`"
            if [[ "$HAS_KEY" != 'true' ]]; then
              echo
              echo "> [!WARNING]"
              echo "> Signed with a throwaway debug key. The next release will not install over this one; uninstall first."
            fi
          } > notes.md

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.assets.outputs.apk }}"
          tag="${{ steps.version.outputs.tag }}"
          # A pushed tag already exists; otherwise the release creates it on the commit it built.
          if [[ "${{ steps.version.outputs.create }}" == 'true' ]]; then
            target=(--target "$GITHUB_SHA")
          else
            target=(--verify-tag)
          fi
          gh release create "$tag" "$apk" "$apk.sha256" \
            --title "Yuvomi for Android ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --generate-notes \
            --prerelease \
            "${target[@]}"
