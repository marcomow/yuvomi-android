# Publishes an installable APK to GitHub Releases when a version tag is pushed
# (docs/RELEASING.md, ADR 0013). Tag format: v<major>.<minor>.<patch>, e.g. v0.2.0.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.YUVOMI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not v<major>.<minor>.<patch>"; exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be at most 99 (versionCode scheme)"; exit 1
          fi
          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.YUVOMI_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "YUVOMI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APK
        env:
          YUVOMI_KEYSTORE_PASSWORD: ${{ secrets.YUVOMI_KEYSTORE_PASSWORD }}
          YUVOMI_KEY_ALIAS: ${{ secrets.YUVOMI_KEY_ALIAS }}
          YUVOMI_KEY_PASSWORD: ${{ secrets.YUVOMI_KEY_PASSWORD }}
        run: |
          if [[ "$HAS_KEY" != 'true' ]]; then
            echo "::warning::No release key in the repository secrets; signing with a throwaway debug key (docs/RELEASING.md)."
            fallback="-Pyuvomi.debugSignRelease=true"
          fi
          ./gradlew --no-daemon assembleRelease \
            -Pyuvomi.versionName='${{ steps.version.outputs.name }}' \
            -Pyuvomi.versionCode='${{ steps.version.outputs.code }}' \
            ${fallback:-}

      - name: Verify signature and prepare assets
        id: assets
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk="yuvomi-android-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          sha256sum "$apk" > "$apk.sha256"
          cert="$(grep -m1 'certificate SHA-256 digest' certs.txt | sed 's/.*: //')"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          {
            echo "Unofficial proof-of-concept Android client for [Yuvomi](https://github.com/ulsklyc/yuvomi). Not affiliated with upstream."
            echo
            echo "- Version ${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }}), built against Yuvomi $(tr -d '[:space:]' < upstream/VERSION)"
            echo "- Android 8.0 or newer. Install by opening the APK on the phone and allowing installs from that app."
            echo "- Signing certificate SHA-256: \`${cert}\`"
            if [[ "$HAS_KEY" != 'true' ]]; then
              echo
              echo "> [!WARNING]"
              echo "> Signed with a throwaway debug key. The next release will not install over this one; uninstall first."
            fi
          } > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.assets.outputs.apk }}"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Yuvomi for Android ${{ steps.version.outputs.name }}" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag
